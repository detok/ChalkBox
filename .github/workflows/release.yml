name: Test and release ChalkBox

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Lua tests and installable ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1 librsvg2-bin
      - name: Verify Lua 5.1 syntax and run every ChalkBox test
        run: |
          set -euo pipefail
          find ChalkBox tests -name '*.lua' -print0 | xargs -0 luac5.1 -p
          for test in tests/test_*.lua; do
            echo "Running $test"
            (cd ChalkBox && lua5.1 "../$test")
          done
      - name: Build and validate the single-addon ZIP
        run: python3 scripts/test_packages.py
      - name: Render and verify CurseForge publishing kit
        run: python3 scripts/test_curseforge_kit.py
      - name: Upload CurseForge media ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChalkBox-CurseForge-media
          path: dist/ChalkBox-CurseForge-Media-*.zip
          if-no-files-found: error
      - name: Upload installable addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ChalkBox-addon
          path: dist/ChalkBox-[0-9]*.zip
          if-no-files-found: error
      - name: Publish release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^## Version: //p' ChalkBox/ChalkBox.toc | head -1)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists: preserving the addon and refreshing the media kit."
            gh release upload "$tag" "dist/ChalkBox-CurseForge-Media-$version.zip" --clobber
          else
            gh release create "$tag" "dist/ChalkBox-$version.zip" \
              "dist/ChalkBox-CurseForge-Media-$version.zip" \
              --target "$GITHUB_SHA" \
              --title "ChalkBox $tag" \
              --notes-file docs/RELEASE_NOTES.md \
              --prerelease
          fi
