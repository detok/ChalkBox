name: Organize incoming issues

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Apply available issue type labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = (context.payload.issue.title || "").toLowerCase();
            const preferred = title.startsWith("[bug]") ? ["bug"] :
              title.startsWith("[feature]") ? ["enhancement"] :
              title.startsWith("[help]") ? ["question"] :
              title.startsWith("[compatibility]") ? ["bug"] : [];
            if (!preferred.length) return;
            // Reuse existing repository labels only. No unexpected label
            // proliferation and no automated comments to bother users.
            const labels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              per_page: 100
            });
            const available = new Set(labels.map(x => x.name.toLowerCase()));
            const applied = preferred.filter(x => available.has(x));
            if (applied.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, labels: applied
              });
            }
