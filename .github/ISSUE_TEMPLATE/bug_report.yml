name: Bug report
description: Report a reproducible problem in ChalkBox or WoW Forever
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping test ChalkBox! Start with the [troubleshooting guide](https://github.com/detok/ChalkBox/blob/main/docs/TROUBLESHOOTING.md).
        **2.0 map issue?** Try \`/chalk drops map\` and \`/chalk drops map status\` and paste the output below.
        Never post passwords, account IDs, private chat, tokens, or identifying screenshots.
  - type: input
    id: addon
    attributes:
      label: ChalkBox version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Game client
      options:
        - WoW Forever / Camelot
        - WoW Classic Era (unverified)
        - Other (explain in details)
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game build / interface version
      placeholder: "From login screen or /dump GetBuildInfo()"
  - type: dropdown
    id: module
    attributes:
      label: ChalkBox feature
      options:
        - Map Discoveries / DropSense
        - MacroForge
        - LootSense / ProfessionSense
        - The Bar / Repair Learning
        - Session Journal
        - Combat Meter / native PRINT
        - QuestSense
        - CampSense / Reminder Toast
        - Global Appearance
        - Emota / QuietGuard / Bags
        - Settings / installation / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
      description: Include real item links, macro text, panel titles, or quest names where relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Helpful diagnostics (especially for map or macro bugs)
      description: "Map: paste /chalk drops map status. MacroForge: /chalk forge status. Include any related map/UI addons."
      placeholder: |
        /chalk drops map status:
        Other addons:
        Fullscreen/windowed map:
  - type: textarea
    id: logs
    attributes:
      label: Lua errors and real-client screenshots (optional)
      description: Paste error text or drag a screenshot here. Redact identifying details.
      render: text
