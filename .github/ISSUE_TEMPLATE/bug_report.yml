name: Bug report
description: Report a reproducible problem in ChalkBox or WoW Forever
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ChalkBox. Start with the [troubleshooting guide](https://github.com/detok/ChalkBox/blob/main/docs/TROUBLESHOOTING.md).
        **Map issue?** Try `/chalk drops map` and `/chalk drops map status` and paste the output below.
        Never post passwords, account IDs, private chat, tokens, or identifying screenshots.
  - type: input
    id: addon
    attributes:
      label: ChalkBox version
      placeholder: "2.2.22 (see /chalk update)"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Game client
      options:
        - WoW Forever / Camelot
        - WoW Classic Era (unverified)
        - Other (explain in details)
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game build / interface version
      placeholder: "From login screen or /dump GetBuildInfo()"
  - type: dropdown
    id: module
    attributes:
      label: ChalkBox feature
      options:
        - AuctionSense / Full Scan / Market
        - AuctionInsights / Bags / DisenchantSense
        - Map Discoveries / DropSense
        - MacroForge
        - LootSense / ProfessionSense
        - The Bar / Repair Learning
        - Session Journal
        - Combat Meter / native PRINT
        - QuestSense
        - CampSense / Reminder Toast
        - Global Appearance
        - Emota / QuietGuard / Bags
        - Updates / installation
        - Settings / other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
      description: Include real item links, macro text, panel titles, or quest names where relevant.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Helpful diagnostics (especially for AuctionSense, map or macros)
      description: "Auction: /chalk auction status, scan type, cooldown and result message. Map: /chalk drops map status. MacroForge: /chalk forge status. Include related addons."
      placeholder: |
        /chalk auction status:
        /chalk drops map status:
        Other addons:
        Fullscreen/windowed map:
  - type: textarea
    id: logs
    attributes:
      label: Lua errors and real-client screenshots (optional)
      description: Paste error text or drag a screenshot here. Redact identifying details.
      render: text
