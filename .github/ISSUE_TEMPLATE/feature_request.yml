name: Feature request
description: Improve ChalkBox for ordinary adventurers
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        ChalkBox aims to protect useful items without unnecessary clutter or automation.
        Please describe the problem you want solved, not just a UI control.
  - type: textarea
    id: problem
    attributes:
      label: What's missing or frustrating?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What should ChalkBox do instead?
      description: Example tooltip text or reminder timing is welcome.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Real item, recipe, class, or gameplay examples (optional)
  - type: dropdown
    id: module
    attributes:
      label: Which module does this affect?
      options:
        - LootSense
        - CampSense
        - TrailBar
        - Emota
        - QuietGuard
        - QuestSense
        - New / Other
