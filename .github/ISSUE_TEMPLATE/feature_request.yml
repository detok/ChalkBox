name: Feature request
description: Suggest a useful improvement to the ChalkBox adventure companion
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        ChalkBox focuses on trustworthy information, familiar WoW UI and player-controlled actions. Tell us what would make an actual adventure smoother.
  - type: textarea
    id: problem
    attributes:
      label: What is frustrating or missing?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How should ChalkBox help?
      description: A specific workflow, command, tooltip, or example is useful.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Feature area
      options:
        - Map Discoveries / DropSense
        - MacroForge
        - LootSense / ProfessionSense
        - The Bar / Repair Learning
        - Session Journal
        - QuestSense / CampSense
        - Combat Meter / native PRINT
        - Global Appearance
        - Emota / QuietGuard / Bags
        - New idea / other
  - type: textarea
    id: examples
    attributes:
      label: Real game examples (optional)
      description: Class/spell, item, zone, dungeon, character workflow or UI screenshot.
